# 내 판단 기준 예시 — 이 파일을 profile.yaml로 복사해 값을 채운다.
# filters.py / judge.py가 읽는다. 값만 바꾸면 기준이 바뀐다.

me:
  home: "서울 마포구"
  # 재직 기간 (경력 계산용). 인턴은 include_internship로 제어
  employment:
    - { company: "예시테크", start: "2024-03-01", end: "2026-02-28", type: "정규직" }
    - { company: "샘플랩스", start: "2023-07-01", end: "2023-08-31", type: "인턴" }
  include_internship: false
  degree: "학사"
  degree_note: "컴퓨터공학 전공"

target:
  preferred_job_families: ["AI/ML 엔지니어", "백엔드"]
  avoid_job_families: ["PM/기획", "보안/컴플라이언스", "영업"]
  preferred_keywords: ["LLM", "RAG", "파인튜닝", "서빙", "Agent", "FastAPI"]
  weak_keywords: ["임베디드", "논문", "3D"]

rules:
  years_tolerance: 0        # 0이면 경력 조건 미달 시 FAIL. 0.5면 6개월 이내 부족은 WARN
  warn_contract: true       # 계약직/인턴 WARN
  warn_new_grad_only: true  # 신입 공채 WARN
  warn_military_flags: ["전문연구요원", "병역특례", "군대체복무"]
  ok_regions: ["서울", "경기 성남", "판교"]
  strict_location: false    # true면 ok_regions 밖은 FAIL

company:
  min_rating: 3.0           # 기업 리뷰 평점 기준 (리뷰 5개 미만이면 적용하지 않음)
  min_reviews_for_rating: 5
  warn_if_headcount_turnover_ratio: 0.4   # (1년 퇴사자 / 현재 인원) 이상이면 경고
